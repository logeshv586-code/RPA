<rect width="1600" height="820" rx="36" fill="url(#bg)"/>
<text x="800" y="66" text-anchor="middle" class="h">RPA-X Autonomy Maturity Model</text>
<text x="800" y="104" text-anchor="middle" class="s" font-size="18">Autonomy is earned progressively — stronger capability never removes policy boundaries</text>
