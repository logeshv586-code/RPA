<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2CE7FF"/><stop offset=".45" stop-color="#4F7DFF"/><stop offset="1" stop-color="#A25BFF"/></linearGradient>
<style>.h{font:800 40px Inter,Segoe UI,Arial;fill:#F3F8FF}.t{font:700 20px Inter,Segoe UI,Arial;fill:#F4F8FF}.s{font:500 15px Inter,Segoe UI,Arial;fill:#A7B7D2}.a{font:900 24px Inter,Segoe UI,Arial;fill:#06101D}</style>
