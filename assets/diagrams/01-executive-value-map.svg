<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#111B38"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27E6FF"/><stop offset=".48" stop-color="#4C82FF"/><stop offset="1" stop-color="#9D5CFF"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#EAF4FF}.s{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#8FA6C9}.role{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#fff}.small{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#A9BAD6}</style>
</defs>
<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<text x="800" y="72" text-anchor="middle" class="t" font-size="42" font-weight="800">RPA-X — One Product, Enterprise-Wide Value</text>
<text x="800" y="112" text-anchor="middle" class="s" font-size="20">A single automation reliability operating system for leadership, builders, operators and governance teams</text>
<!-- core -->
<circle cx="800" cy="455" r="174" fill="#0B1730" stroke="url(#core)" stroke-width="7" filter="url(#glow)"/>
<circle cx="800" cy="455" r="128" fill="#0E1E3B" stroke="#2C6EFF" stroke-opacity=".45"/>
<text x="800" y="427" text-anchor="middle" class="t" font-size="62" font-weight="900">RPA-X</text>
<text x="800" y="467" text-anchor="middle" class="s" font-size="20" font-weight="700">AUTOMATION RELIABILITY OS</text>
<text x="800" y="510" text-anchor="middle" class="t" font-size="18">Observe · Reason · Heal · Govern · Learn</text>
<!-- connector lines -->
<g stroke="#4D7DFF" stroke-width="2" stroke-opacity=".45" fill="none">
<path d="M660 355L425 225"/><path d="M940 355L1175 225"/><path d="M625 455L350 455"/><path d="M975 455L1250 455"/><path d="M660 555L425 685"/><path d="M940 555L1175 685"/><path d="M800 281L800 165"/><path d="M800 629L800 755"/>
</g>
