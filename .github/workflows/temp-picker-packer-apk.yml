name: Temporary Picker Packer APK Build
on:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: github.head_ref == 'picker-packer-apk-build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Android source
        run: |
          mkdir -p app/src/main/java/com/minutesacademy/pickerpacker
          cat _apk_src/MainActivity.part* > app/src/main/java/com/minutesacademy/pickerpacker/MainActivity.java
          test -s app/src/main/java/com/minutesacademy/pickerpacker/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PickerPackerTraining-UROVO-DT50S.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PickerPackerTraining-UROVO-DT50S
          path: PickerPackerTraining-UROVO-DT50S.apk
          if-no-files-found: error
          retention-days: 14
