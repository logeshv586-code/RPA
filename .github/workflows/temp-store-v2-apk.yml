name: Temporary Store V2 APK Build
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    if: github.head_ref == 'picker-packer-store-v2-build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct Android project
        run: |
          base64 -d store_v2_android_project.tgz.b64 > /tmp/android.tgz
          tar -xzf /tmp/android.tgz
          test -f android/app/src/main/java/com/minutesacademy/pickerpacker/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PickerPackerTraining-StoreScoped-v2-UROVO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PickerPackerTraining-StoreScoped-v2-UROVO
          path: PickerPackerTraining-StoreScoped-v2-UROVO.apk
          if-no-files-found: error
          retention-days: 14
